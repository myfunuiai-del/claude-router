<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Glowing Hexagon Gradients -->
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="innerHexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- Lighting Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title-white { font-size: 44px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
    .title-blue { font-size: 44px; font-weight: 800; fill: #38bdf8; letter-spacing: -0.5px; }
    .subtitle { font-size: 13px; fill: #94a3b8; font-weight: 400; line-height: 1.5; }
    .pill-text { font-size: 11px; font-weight: 600; }
  </style>

  <!-- Outer Rounded Container -->
  <rect x="2" y="2" width="996" height="336" rx="20" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Background Decorative Glowing Orbs -->
  <circle cx="210" cy="170" r="140" fill="#0284c7" opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="820" cy="120" r="130" fill="#7c3aed" opacity="0.08" filter="url(#softGlow)"/>

  <!-- LEFT: Hexagonal Tech Logo Icon -->
  <g transform="translate(190, 170)">
    <!-- Outer Glow Hexagon Ring -->
    <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50"
             fill="url(#innerHexGrad)" stroke="url(#hexGrad)" stroke-width="4" filter="url(#glow)"/>

    <!-- Subtle Inner Hexagon Accent -->
    <polygon points="0,-85 73.6,-42.5 73.6,42.5 0,85 -73.6,42.5 -73.6,-42.5"
             fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6,4" opacity="0.4"/>

    <!-- Router Nodes & Hub Graphic Inside Logo -->
    <g transform="translate(0, -6)">
      <!-- Server Node Top -->
      <rect x="-24" y="-38" width="48" height="13" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="-14" cy="-31.5" r="2.5" fill="#38bdf8"/>
      <circle cx="-6" cy="-31.5" r="2.5" fill="#38bdf8"/>
      <circle cx="14" cy="-31.5" r="2.5" fill="#4ade80"/>

      <!-- Server Node Middle -->
      <rect x="-24" y="-18" width="48" height="13" rx="3" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
      <circle cx="-14" cy="-11.5" r="2.5" fill="#818cf8"/>
      <circle cx="-6" cy="-11.5" r="2.5" fill="#818cf8"/>
      <circle cx="14" cy="-11.5" r="2.5" fill="#38bdf8"/>

      <!-- Server Node Bottom -->
      <rect x="-24" y="2" width="48" height="13" rx="3" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
      <circle cx="-14" cy="8.5" r="2.5" fill="#c084fc"/>
      <circle cx="-6" cy="8.5" r="2.5" fill="#c084fc"/>
      <circle cx="14" cy="8.5" r="2.5" fill="#f59e0b"/>

      <!-- Split / Routing Dynamic Curves -->
      <path d="M 28,-31.5 C 50,-31.5 52,0 35,26" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M -28,-11.5 C -46,-11.5 -48,15 -32,28" fill="none" stroke="#818cf8" stroke-width="2.2" stroke-linecap="round"/>

      <!-- Dynamic Lightning Bolt Over Node -->
      <path d="M 12,-48 L -4,-18 L 6,-18 L 0,16 L 20,-12 L 8,-12 Z" fill="url(#boltGrad)" filter="url(#glow)"/>
    </g>
  </g>

  <!-- RIGHT: Content Information -->
  <g transform="translate(340, 52)" class="font-sans">

    <!-- Top Category Pill -->
    <g transform="translate(0, 0)">
      <rect width="180" height="24" rx="12" fill="#0c4a6e" fill-opacity="0.4" stroke="#0284c7" stroke-width="1"/>
      <circle cx="14" cy="12" r="3.5" fill="#38bdf8"/>
      <text x="25" y="16" class="pill-text" fill="#38bdf8" letter-spacing="0.8">AI GATEWAY &amp; FAILOVER</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 62)">
      <text class="title-white">Claude <tspan class="title-blue">Router</tspan></text>
    </g>

    <!-- Subtitle / Value Proposition Description -->
    <g transform="translate(0, 96)">
      <text x="0" y="0" class="subtitle">Zero-Dependency AI Proxy Gateway with 5-Stage Context Recovery,</text>
      <text x="0" y="20" class="subtitle">Instant Rate-Limit Key Failover &amp; Bundled AI SVG Vector Intelligence.</text>
    </g>

    <!-- Key Feature Pills (Exact match to theme in reference) -->
    <g transform="translate(0, 150)">
      <!-- Pill 1: 5-Stage Recovery -->
      <g transform="translate(0, 0)">
        <rect width="144" height="28" rx="7" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
        <text x="12" y="18" class="pill-text" fill="#f59e0b">⚡ 5-Stage Recovery</text>
      </g>

      <!-- Pill 2: Zero 429 Cooldown -->
      <g transform="translate(154, 0)">
        <rect width="146" height="28" rx="7" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
        <text x="12" y="18" class="pill-text" fill="#4ade80">❄️ Zero-429 Cooldown</text>
      </g>

      <!-- Pill 3: Bundled SVG -->
      <g transform="translate(310, 0)">
        <rect width="138" height="28" rx="7" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
        <text x="12" y="18" class="pill-text" fill="#c084fc">🎨 Bundled SVG Gen</text>
      </g>

      <!-- Pill 4: Mobile Web UI -->
      <g transform="translate(458, 0)">
        <rect width="132" height="28" rx="7" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
        <text x="12" y="18" class="pill-text" fill="#38bdf8">🎛️ Live Web UI</text>
      </g>
    </g>

    <!-- Platform & Compatibility Tagline -->
    <g transform="translate(0, 218)" opacity="0.85">
      <text x="0" y="0" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">BUILT FOR:</text>
      <text x="75" y="0" font-size="11" font-weight="600" fill="#cbd5e1" letter-spacing="0.5">CLAUDE CODE &bull; ANTIGRAVITY &bull; AIDER &bull; OPENAI &bull; ANTHROPIC SDK</text>
    </g>

  </g>
</svg>
