<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Theme Gradients -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="amberOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 38px; fill: #ffffff; letter-spacing: -0.5px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 12px; fill: #06b6d4; letter-spacing: 1.5px; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 15px; fill: #94a3b8; }
    .pill-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11px; }
  </style>

  <!-- Card Background -->
  <rect width="800" height="240" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Light Effect -->
  <circle cx="120" cy="120" r="90" fill="#3b82f6" opacity="0.12" filter="url(#glow)" />
  <circle cx="210" cy="80" r="70" fill="#8b5cf6" opacity="0.08" filter="url(#glow)" />

  <!-- Left Icon Area -->
  <g transform="translate(45, 45)">
    <!-- Hexagon Frame matching Video Analyzer style -->
    <polygon points="75,5 140,42 140,118 75,155 10,118 10,42" fill="#0f172a" stroke="url(#cyberCyan)" stroke-width="2.5" filter="url(#softGlow)" opacity="0.9" />

    <!-- Central Router Server Box -->
    <rect x="36" y="52" width="60" height="46" rx="8" fill="url(#cyberCyan)" opacity="0.15" />
    <rect x="36" y="52" width="60" height="46" rx="8" stroke="url(#cyberCyan)" stroke-width="2" fill="none" />

    <!-- 3 Dynamic Server Tier Bars Inside -->
    <rect x="44" y="60" width="44" height="6" rx="3" fill="#38bdf8" />
    <circle cx="48" cy="63" r="1.5" fill="#ffffff" />
    <circle cx="82" cy="63" r="1.5" fill="#4ade80" />

    <rect x="44" y="72" width="44" height="6" rx="3" fill="#818cf8" />
    <circle cx="48" cy="75" r="1.5" fill="#ffffff" />
    <circle cx="82" cy="75" r="1.5" fill="#38bdf8" />

    <rect x="44" y="84" width="44" height="6" rx="3" fill="#c084fc" />
    <circle cx="48" cy="87" r="1.5" fill="#ffffff" />
    <circle cx="82" cy="87" r="1.5" fill="#f59e0b" />

    <!-- Network Routing Node Dots & Curves -->
    <circle cx="112" cy="63" r="3.5" fill="#38bdf8" />
    <path d="M 96,63 L 108,63" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="2,2" />

    <circle cx="112" cy="87" r="3.5" fill="#c084fc" />
    <path d="M 96,87 L 108,87" stroke="#c084fc" stroke-width="1.8" stroke-dasharray="2,2" />

    <!-- Lightning / Failover Spark -->
    <path d="M124 35 L112 50 L120 50 L114 65 L130 47 L122 47 Z" fill="url(#amberOrange)" filter="url(#glow)" />
  </g>

  <!-- Typography / Brand -->
  <!-- Tag / Pill Badge -->
  <g transform="translate(230, 44)">
    <rect width="180" height="24" rx="12" fill="#0c4a6e" fill-opacity="0.5" stroke="#0284c7" stroke-width="1" />
    <circle cx="14" cy="12" r="3.5" fill="#38bdf8" filter="url(#softGlow)" />
    <text x="24" y="16" class="badge-text">AI GATEWAY &amp; ROUTING</text>
  </g>

  <!-- Main Title -->
  <text x="230" y="104" class="title-text">
    Claude Router <tspan fill="url(#cyberCyan)">Gateway</tspan>
  </text>

  <!-- Tagline / Subtitle -->
  <text x="230" y="136" class="sub-text">
    Zero-Dependency AI Proxy with 5-Stage Context Auto-Recovery,
  </text>
  <text x="230" y="158" class="sub-text">
    Zero-429 Key Cooldown Failover &amp; Bundled AI SVG Vector Intelligence.
  </text>

  <!-- Feature Pills / Highlights (Exact same styling as reference) -->
  <g transform="translate(230, 182)">
    <!-- Pill 1: 5-Stage Recovery -->
    <g transform="translate(0, 0)">
      <rect width="126" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="10" y="17" class="pill-label" fill="#f59e0b">⚡ 5-Stage Recovery</text>
    </g>

    <!-- Pill 2: Zero 429 -->
    <g transform="translate(134, 0)">
      <rect width="128" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="10" y="17" class="pill-label" fill="#34d399">❄️ Zero-429 Failover</text>
    </g>

    <!-- Pill 3: SVG Generator -->
    <g transform="translate(270, 0)">
      <rect width="128" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="10" y="17" class="pill-label" fill="#c084fc">🎨 Bundled SVG Gen</text>
    </g>

    <!-- Pill 4: Mobile Web Console -->
    <g transform="translate(406, 0)">
      <rect width="120" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="10" y="17" class="pill-label" fill="#38bdf8">🎛️ Live Web UI</text>
    </g>
  </g>
</svg>
